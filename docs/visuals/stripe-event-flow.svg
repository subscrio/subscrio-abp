<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Stripe to ABP to Subscrio event flow</title>
  <desc id="desc">Stripe sends a webhook to the ABP Payment Module. ABP publishes a distributed subscription event, a Subscrio handler updates the customer subscription, and future ABP feature checks use the new entitlement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#696dc0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17203a" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f7f8fc"/>
  <text x="60" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#17203a">Turn billing events into current feature access</text>
  <text x="60" y="118" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#566078">ABP handles Stripe and publishes subscription events. Subscrio turns those events into entitlements.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="210" width="160" height="130" rx="20" fill="#635bff"/>
    <text x="135" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">STRIPE</text>
    <text x="135" y="302" text-anchor="middle" font-size="17" fill="#ffffff">Webhook event</text>
    <rect x="275" y="210" width="195" height="130" rx="20" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="372" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#696dc0">ABP PAYMENT</text>
    <text x="372" y="286" text-anchor="middle" font-size="18" fill="#17203a">Payment Module</text>
    <text x="372" y="312" text-anchor="middle" font-size="16" fill="#566078">handles webhook</text>
    <rect x="530" y="210" width="195" height="130" rx="20" fill="#fff8e8" stroke="#e9c86a" stroke-width="2"/>
    <text x="627" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6811">ABP EVENT BUS</text>
    <text x="627" y="286" text-anchor="middle" font-size="17" fill="#5e4b18">Distributed</text>
    <text x="627" y="312" text-anchor="middle" font-size="17" fill="#5e4b18">subscription event</text>
    <rect x="785" y="210" width="195" height="130" rx="20" fill="#696dc0"/>
    <text x="882" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#e9eaff">SUBSCRIO ADAPTER</text>
    <text x="882" y="292" text-anchor="middle" font-size="18" fill="#ffffff">Event handler</text>
    <text x="882" y="316" text-anchor="middle" font-size="16" fill="#ffffff">updates subscription</text>
    <rect x="1040" y="210" width="110" height="130" rx="20" fill="#eef0fb" stroke="#c5c9e7" stroke-width="2"/>
    <text x="1095" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#696dc0">DATA</text>
    <text x="1095" y="295" text-anchor="middle" font-size="16" fill="#17203a">Customer</text>
    <text x="1095" y="318" text-anchor="middle" font-size="16" fill="#17203a">subscription</text>
  </g>
  <g fill="none" stroke="#696dc0" stroke-width="4" marker-end="url(#arrow)">
    <path d="M215 275 H265"/><path d="M470 275 H520"/><path d="M725 275 H775"/><path d="M980 275 H1030"/>
  </g>
  <path d="M1095 340 V380 H810 V395" fill="none" stroke="#696dc0" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="60" y="400" width="325" height="130" rx="20" fill="#ffffff" stroke="#696dc0" stroke-width="3"/>
    <text x="222" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#696dc0">NEXT APPLICATION REQUEST</text>
    <text x="222" y="487" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="18" fill="#17203a">IFeatureChecker</text>
    <rect x="470" y="400" width="680" height="130" rx="20" fill="#e9f7ef" stroke="#8bc9a4" stroke-width="2"/>
    <text x="810" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#245b3a">The customer gets the entitlement that matches the new subscription state</text>
    <text x="810" y="488" text-anchor="middle" font-size="18" fill="#356b4b">Renewals, plan changes, and cancellations flow through the same path.</text>
  </g>
  <path d="M385 465 H460" fill="none" stroke="#696dc0" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
