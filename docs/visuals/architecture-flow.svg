<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ABP and Subscrio architecture flow</title>
  <desc id="desc">ABP application code calls IFeatureChecker, which uses a Subscrio feature value provider, a tenant or user customer resolver, and an entitlement resolver backed by plan, subscription, and override data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#696dc0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17203a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7f8fc"/>
  <text x="60" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#17203a">Keep ABP's feature API. Add subscription context behind it.</text>
  <text x="60" y="122" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#566078">Application code stays unchanged while Subscrio resolves the customer's current entitlement.</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="220" width="200" height="150" rx="18" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="160" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#696dc0">YOUR APP</text>
    <text x="160" y="312" text-anchor="middle" font-size="22" font-weight="650" fill="#17203a">ABP business</text>
    <text x="160" y="341" text-anchor="middle" font-size="22" font-weight="650" fill="#17203a">code</text>
    <rect x="305" y="220" width="200" height="150" rx="18" fill="#ffffff" stroke="#696dc0" stroke-width="3"/>
    <text x="405" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#696dc0">ABP API</text>
    <text x="405" y="322" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="19" fill="#17203a">IFeatureChecker</text>
    <rect x="550" y="220" width="220" height="150" rx="18" fill="#696dc0"/>
    <text x="660" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#e9eaff">SUBSCRIO.ABP MODULE</text>
    <text x="660" y="312" text-anchor="middle" font-size="21" font-weight="650" fill="#ffffff">Feature value</text>
    <text x="660" y="341" text-anchor="middle" font-size="21" font-weight="650" fill="#ffffff">provider</text>
    <text x="660" y="361" text-anchor="middle" font-size="13" fill="#e9eaff">tenant or user resolver</text>
    <rect x="815" y="220" width="190" height="150" rx="18" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="910" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#696dc0">SUBSCRIO</text>
    <text x="910" y="312" text-anchor="middle" font-size="21" font-weight="650" fill="#17203a">Entitlement</text>
    <text x="910" y="341" text-anchor="middle" font-size="21" font-weight="650" fill="#17203a">resolver</text>
    <rect x="1040" y="220" width="110" height="150" rx="18" fill="#eef0fb" stroke="#c5c9e7" stroke-width="2"/>
    <text x="1095" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#696dc0">DATA</text>
    <text x="1095" y="304" text-anchor="middle" font-size="16" fill="#17203a">Plans</text>
    <text x="1095" y="329" text-anchor="middle" font-size="16" fill="#17203a">Subs</text>
    <text x="1095" y="354" text-anchor="middle" font-size="16" fill="#17203a">Overrides</text>
  </g>
  <g fill="none" stroke="#696dc0" stroke-width="4" marker-end="url(#arrow)">
    <path d="M260 295 H295"/><path d="M505 295 H540"/><path d="M770 295 H805"/><path d="M1005 295 H1030"/>
  </g>
  <rect x="305" y="442" width="700" height="84" rx="16" fill="#e9f7ef" stroke="#8bc9a4" stroke-width="2"/>
  <text x="655" y="478" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245b3a">Result: the right value for this tenant, at this moment</text>
  <text x="655" y="507" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#356b4b">No subscription logic leaks into application services or controllers.</text>
</svg>
