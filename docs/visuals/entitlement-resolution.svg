<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Customer entitlement resolution</title>
  <desc id="desc">The acme-max-projects feature resolves to 250 from a subscription override, ahead of the plan value of 100 and ABP default of 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#696dc0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17203a" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f7f8fc"/>
  <text x="60" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#17203a">How one customer gets a feature value</text>
  <text x="60" y="118" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#566078">Subscrio checks the most specific value first, then returns it through ABP.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="60" y="178" width="1080" height="92" rx="18" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="95" y="213" font-size="15" font-weight="700" fill="#696dc0">ABP REQUEST</text>
    <text x="95" y="248" font-family="Cascadia Code, Consolas, monospace" font-size="22" fill="#17203a">IFeatureChecker.GetAsync&lt;int&gt;(AppFeatures.MaxProjects)  // acme-max-projects</text>
    <rect x="60" y="330" width="310" height="176" rx="20" fill="#696dc0"/>
    <text x="95" y="372" font-size="16" font-weight="700" fill="#e9eaff">1. SUBSCRIPTION OVERRIDE</text>
    <text x="95" y="425" font-size="42" font-weight="750" fill="#ffffff">250</text>
    <text x="95" y="466" font-size="18" fill="#ffffff">Acme's negotiated limit</text>
    <circle cx="332" cy="370" r="18" fill="#42b875"/><path d="M323 370 l7 7 13 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="445" y="330" width="310" height="176" rx="20" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="480" y="372" font-size="16" font-weight="700" fill="#696dc0">2. PLAN VALUE</text>
    <text x="480" y="425" font-size="42" font-weight="750" fill="#9ba2b8">100</text>
    <text x="480" y="466" font-size="18" fill="#7b8399">Pro plan allowance</text>
    <rect x="830" y="330" width="310" height="176" rx="20" fill="#ffffff" stroke="#d7daea" stroke-width="2"/>
    <text x="865" y="372" font-size="16" font-weight="700" fill="#696dc0">3. ABP DEFAULT</text>
    <text x="865" y="425" font-size="42" font-weight="750" fill="#9ba2b8">3</text>
    <text x="865" y="466" font-size="18" fill="#7b8399">Feature definition fallback</text>
  </g>
  <g stroke="#696dc0" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M215 290 V320"/><path d="M600 290 V320"/><path d="M985 290 V320"/></g>
  <path d="M215 506 V563 H600" stroke="#696dc0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="600" y="536" width="540" height="90" rx="18" fill="#e9f7ef" stroke="#8bc9a4" stroke-width="2"/>
  <text x="870" y="574" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245b3a">ABP receives 250</text>
  <text x="870" y="604" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#356b4b">The first matching value wins.</text>
</svg>
