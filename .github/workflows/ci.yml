name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: integrations/abp

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: integrations/abp
        run: dotnet restore .\Subscrio.Abp.Sample.slnx

      - name: Build
        working-directory: integrations/abp
        run: dotnet build .\Subscrio.Abp.Sample.slnx --configuration Release --no-restore

      - name: Test
        working-directory: integrations/abp
        run: dotnet test .\Subscrio.Abp.Sample.slnx --configuration Release --no-build

      - name: Pack
        working-directory: integrations/abp
        run: dotnet pack .\src\Subscrio.Abp\Subscrio.Abp.csproj --configuration Release --no-build --output .\artifacts
